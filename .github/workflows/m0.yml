name: M0 contracts and skeletons

on:
  pull_request:
    branches: [codex/rework-core]
  push:
    branches: [codex/rework-m0]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.10"
          enable-cache: true
      - run: uv sync --frozen --dev
      - run: uv run python scripts/export_v2_schemas.py
      - run: git diff --exit-code -- docs/rework/contracts/generated
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
